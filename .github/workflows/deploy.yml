name: Deploy to VPS with Docker

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Copiar archivos al VPS (rsync por SSH)
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude=".git*" --exclude=".github" --exclude="backend/.env" --exclude="venv"
          path: ./
          remote_path: /home/${{ secrets.VPS_USER }}/servidor_charles/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Desplegar con Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/servidor_charles
            docker-compose down
            docker-compose pull
            docker-compose up -d --build
            docker system prune -f