version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: servidor_charles_db
    environment:
      POSTGRES_DB: bd_server
      POSTGRES_USER: daniel_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daniel_user -d bd_server"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: servidor_charles_backend
    environment:
      DB_HOST: db
      DB_NAME: bd_server
      DB_USER: daniel_user
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_PORT: 5432
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
